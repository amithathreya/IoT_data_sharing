name: Build Desktop Applications (Windows & Linux)

on:
  push:
    branches:
      - main
      - server-app
  pull_request:
    branches:
      - main
      - server-app
  workflow_dispatch: # Allows manual trigger from GitHub Actions web UI

jobs:
  # ─── Windows Build ────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows Desktop (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Doctor
        run: flutter doctor -v

      - name: Install Dependencies
        working-directory: server_app
        run: flutter pub get

      - name: Run Tests
        working-directory: server_app
        run: flutter test

      - name: Build Windows Desktop Release
        working-directory: server_app
        run: flutter build windows --release

      - name: Package Windows Binary
        shell: pwsh
        run: |
          $exeFile = Get-ChildItem -Path server_app/build/windows -Recurse -Filter "server_app.exe" | Select-Object -First 1
          if (-not $exeFile) {
            throw "server_app.exe was not found in build directory!"
          }
          $releaseDir = $exeFile.DirectoryName
          Write-Host "Found release directory at: $releaseDir"
          Compress-Archive -Path "$releaseDir\*" -DestinationPath "server_app_windows_x64.zip" -Force
          Write-Host "Created server_app_windows_x64.zip"

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: server_app_windows_x64
          path: server_app_windows_x64.zip
          retention-days: 30

  # ─── Linux Build ──────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux Desktop (Binary Bundle)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Install Dependencies
        working-directory: server_app
        run: flutter pub get

      - name: Run Tests
        working-directory: server_app
        run: flutter test

      - name: Build Linux Desktop Release
        working-directory: server_app
        run: flutter build linux --release

      - name: Package Linux Binary
        run: |
          BUNDLE_DIR=$(find server_app/build/linux -type d -name "bundle" | head -n 1)
          if [ -z "$BUNDLE_DIR" ]; then
            echo "Bundle directory not found!"
            exit 1
          fi
          echo "Found bundle directory: $BUNDLE_DIR"
          tar -czf server_app_linux_x64.tar.gz -C "$BUNDLE_DIR" .
          echo "Created server_app_linux_x64.tar.gz"

      - name: Upload Linux Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: server_app_linux_x64
          path: server_app_linux_x64.tar.gz
          retention-days: 30
