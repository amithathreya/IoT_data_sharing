version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: pqc-rabbitmq
    ports:
      - "5672:5672"
      - "5671:5671"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: pqc_user
      RABBITMQ_DEFAULT_PASS: pqc_password
    volumes:
      # Map the certificates folder
      - ./certs:/etc/rabbitmq/certs:ro
      # Map the new configuration file we just created
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: pqc-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SERVER_ROOT_URL=http://${PROJECT_IP}:3000/
      - GF_LIVE_ALLOWED_ORIGINS=*
    volumes:
      - grafana-storage:/var/lib/grafana
    restart: unless-stopped

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pqc-consumer
    restart: unless-stopped
    environment:
      - BROKER_HOST=rabbitmq
      - BROKER_PORT=5671
      - BESU_RPC_URL=http://host.docker.internal:8545
      - DASHBOARD_URL=http://host.docker.internal:4000/api/data
    volumes:
      - ./certs:/app/certs:ro
      - ./audio_in:/app/audio_in
      - ./contract_abi.json:/app/contract_abi.json:ro
      - ./contract_address.txt:/app/contract_address.txt:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - rabbitmq

  xfl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pqc-xfl
    command: ["python", "-u", "xtreme_federated_learning/server_xfl.py"]
    restart: unless-stopped
    environment:
      - BROKER_HOST=rabbitmq
      - BROKER_PORT=5671
      - DASHBOARD_URL=http://host.docker.internal:4000/api/xfl
    volumes:
      - ./certs:/app/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - rabbitmq

volumes:
  grafana-storage:
